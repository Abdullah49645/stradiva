AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  Odolite - one upload API, one container-image processing function, one bucket, one jobs table.
  Sized from a measured run (docs/aws.md): a 15 s 720p clip peaked at 2.0 GB RSS and took
  about 25 s on 2 vCPUs (development machine), which fits one Lambda invocation; no queues,
  step functions or ECS.

Parameters:
  AllowedOrigin:
    Type: String
    Default: "*"
    Description: Web origin allowed to call the API and to PUT uploads (set to the UI's URL in production).
  MaxClipSeconds:
    Type: Number
    Default: 15
  ProcessingArchitecture:
    Type: String
    Default: x86_64
    AllowedValues: [x86_64, arm64]
    Description: arm64 runs the processing function on Graviton (all pinned wheels exist for aarch64; not benchmarked).

Globals:
  Function:
    Tracing: Active

Resources:
  OdoliteBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub odolite-videos-${AWS::AccountId}-${AWS::Region}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: {SSEAlgorithm: AES256}
      CorsConfiguration:            # the browser PUTs the video straight to S3 with the presigned URL
        CorsRules:
          - AllowedMethods: [PUT]
            AllowedOrigins: [!Ref AllowedOrigin]
            AllowedHeaders: ["*"]
            MaxAge: 3000
      LifecycleConfiguration:       # accident footage is sensitive: keep it no longer than needed
        Rules:
          - {Id: ExpireUploads, Status: Enabled, Prefix: uploads/, ExpirationInDays: 7}
          - {Id: ExpireResults, Status: Enabled, Prefix: results/, ExpirationInDays: 30}

  JobsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions: [{AttributeName: job_id, AttributeType: S}]
      KeySchema: [{AttributeName: job_id, KeyType: HASH}]
      TimeToLiveSpecification: {AttributeName: expires_at, Enabled: true}

  ProcessingFunction:
    Type: AWS::Serverless::Function
    Properties:
      PackageType: Image
      Architectures: [!Ref ProcessingArchitecture]
      MemorySize: 4096
      Timeout: 900
      EphemeralStorage: {Size: 2048}
      ReservedConcurrentExecutions: 3      # cost ceiling for a public demo
      Environment:
        Variables:
          JOBS_TABLE: !Ref JobsTable
          ODOLITE_MAX_SECONDS: !Ref MaxClipSeconds
      Policies:
        - S3CrudPolicy: {BucketName: !Sub "odolite-videos-${AWS::AccountId}-${AWS::Region}"}
        - DynamoDBCrudPolicy: {TableName: !Ref JobsTable}
      Events:
        VideoUploaded:
          Type: S3
          Properties:
            Bucket: !Ref OdoliteBucket
            Events: s3:ObjectCreated:*
            Filter: {S3Key: {Rules: [{Name: prefix, Value: uploads/}]}}
    Metadata:
      Dockerfile: infrastructure/docker/Dockerfile.lambda
      DockerContext: ../..
      DockerTag: odolite-2.2

  ApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      Runtime: python3.12
      Handler: api_handler.handler
      CodeUri: .
      Timeout: 30
      MemorySize: 512
      Environment:
        Variables:
          ODOLITE_BUCKET: !Ref OdoliteBucket
          JOBS_TABLE: !Ref JobsTable
          ODOLITE_ALLOWED_ORIGIN: !Ref AllowedOrigin
      Policies:
        - S3CrudPolicy: {BucketName: !Ref OdoliteBucket}
        - DynamoDBCrudPolicy: {TableName: !Ref JobsTable}
      Events:
        CreateJob: {Type: Api, Properties: {Path: /jobs, Method: post, RestApiId: !Ref OdoliteApi}}
        GetJob: {Type: Api, Properties: {Path: "/jobs/{job_id}", Method: get, RestApiId: !Ref OdoliteApi}}
        Health: {Type: Api, Properties: {Path: /health, Method: get, RestApiId: !Ref OdoliteApi}}

  OdoliteApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: Prod
      Cors:
        AllowMethods: "'GET,POST,OPTIONS'"
        AllowHeaders: "'Content-Type'"
        AllowOrigin: !Sub "'${AllowedOrigin}'"
      MethodSettings:
        - {ResourcePath: "/*", HttpMethod: "*", ThrottlingRateLimit: 5, ThrottlingBurstLimit: 10}

Outputs:
  ApiEndpoint:
    Description: Set NEXT_PUBLIC_ODOLITE_API_BASE to this value for the web UI
    Value: !Sub "https://${OdoliteApi}.execute-api.${AWS::Region}.amazonaws.com/Prod"
  BucketName:
    Value: !Ref OdoliteBucket
